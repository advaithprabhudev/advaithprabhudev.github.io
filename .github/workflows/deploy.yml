name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install, build, and upload
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  enforce-https:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Enable Enforce HTTPS once a certificate is issued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          cfg=$(curl -sf "${auth[@]}" "$api")
          cname=$(jq -r '.cname // "none"' <<<"$cfg")
          enforced=$(jq -r '.https_enforced' <<<"$cfg")
          cert_state=$(jq -r '.https_certificate.state // "none"' <<<"$cfg")
          echo "cname=${cname} https_enforced=${enforced} cert_state=${cert_state} build_type=$(jq -r '.build_type' <<<"$cfg")"

          if [ "$cname" != "advaithprabhu.me" ]; then
            echo "unexpected cname; not touching https_enforced"
            exit 0
          fi
          if [ "$enforced" = "true" ]; then
            echo "already enforced"
            exit 0
          fi
          if [ "$cert_state" != "approved" ]; then
            echo "certificate not approved yet; skipping so the live site is not redirected to a bad cert"
            exit 0
          fi

          curl -sf -X PATCH "${auth[@]}" "$api" -d '{"https_enforced": true}' >/dev/null
          echo "Enforce HTTPS enabled"
